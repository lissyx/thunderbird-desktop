---
loader: comm_taskgraph.loader.merge:loader
only-for-project: enterprise-thunderbird
reference-base-path: taskcluster/kinds

kind-dependencies:
    - enterprise-repack-repackage-signing
    - repackage-signing-msi
    - repackage-deb
    - enterprise-repack-mac-notarization
    - toolchain

reference-tasks:
    - push

transforms:
    - comm_taskgraph.transforms.enterprise:override_with_task_defaults
    - taskgraph.transforms.from_deps
    - gecko_taskgraph.transforms.enterprise_release_definition
    - comm_taskgraph.transforms.enterprise:use_comm_repository_in_release_definition
    - gecko_taskgraph.transforms.enterprise_oci_registry
    - gecko_taskgraph.transforms.job
    - gecko_taskgraph.transforms.task

# Applied over the Firefox Enterprise task by override_with_task_defaults.
task-defaults:
    run-on-projects: [enterprise-thunderbird]
    shipping-product: thunderbird-enterprise
    # Thunderbird Enterprise repacks are scheduled by the decision task.
    shipping-phase: build
    worker:
        env:
            REGISTRY_REFERENCE: harbor.stage.fx-enterprise.nonprod.webservices.mozgcp.net/enterprise-shipit-dev/thunderbird
    treeherder:
        platform: thunderbird-release-enterprise/opt
    release-config:
        product: ThunderbirdEnterprise
        documentation-url: null
    build-assets:
        # Relative to the comm repository, which the release definition points
        # at (see use_comm_repository_in_release_definition).
        policies-schema: "mail/components/enterprisepolicies/schemas/policies-schema-enterprise.json"
        policies-ftl-source: "mail/locales/en-US/messenger/policies/policies-descriptions.ftl"
        policies-ftl-l10n: "mail/messenger/policies/policies-descriptions.ftl"
        l10n-repo: "https://raw.githubusercontent.com/thunderbird/thunderbird-l10n"
        # Read from the local checkout, relative to the gecko root.
        enterprise-l10n: "comm/mail/locales/enterprise-l10n-changesets.json"
